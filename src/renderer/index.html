<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>electron-chatgpt-poc</title>
    <link rel="stylesheet" href="./vendor/xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <header class="ide-header">
        <div class="ide-header__brand">
          <span class="ide-header__product">ChatGPT Desktop PoC</span>
          <span class="ide-header__edition">PyCharm-style layout</span>
        </div>
        <div class="ide-header__window">Electron Workbench</div>
      </header>

      <div class="ide-main">
        <aside class="sidebar">
          <div class="sidebar-main">
            <nav class="sidebar-activity" id="sidebar-activity" aria-label="Sidebar tabs">
              <button class="sidebar-activity__button sidebar-activity__button--active" data-sidebar-tab="explorer" type="button" title="Projects" aria-label="Projects">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M1.75 4.25h4.2l1.4 1.5h6.9v6.5H1.75z" />
                  <path d="M1.75 4.25V2.75h4.65l1.1 1.5" />
                </svg>
                <span class="sidebar-activity__tooltip">Projects</span>
              </button>
              <button class="sidebar-activity__button" data-sidebar-tab="files" type="button" title="File view" aria-label="File view">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M4 2.1h5l3 3V13.9H4z" />
                  <path d="M9 2.1v3h3" />
                  <path d="M6 8.1h4M6 10.2h4M6 12.3h3.3" />
                </svg>
                <span class="sidebar-activity__tooltip">File view</span>
              </button>
              <button class="sidebar-activity__button" data-sidebar-tab="prompts" type="button" title="Prompts" aria-label="Prompts">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M6.65 13.5h2.7" />
                  <path d="M6.4 11.85h3.2" />
                  <path d="M8 2.1a4.15 4.15 0 0 0-2.9 7.12c.6.57 1.02 1.08 1.2 1.73h3.4c.18-.65.6-1.16 1.2-1.73A4.15 4.15 0 0 0 8 2.1Z" />
                </svg>
                <span class="sidebar-activity__tooltip">Prompts</span>
              </button>
            </nav>
            <div class="sidebar-content">
              <div class="sidebar-panels">
                <section class="sidebar-panel sidebar-panel--active" id="sidebar-panel-explorer">
                  <section class="project-list" id="project-list"></section>
                </section>
                <section class="sidebar-panel" id="sidebar-panel-files">
                  <section class="file-view-panel" id="file-view-panel"></section>
                </section>
                <section class="sidebar-panel" id="sidebar-panel-prompts">
                  <section class="prompt-view-panel" id="prompt-view-panel"></section>
                </section>
              </div>
              <div class="new-files-panel-resizer" id="new-files-panel-resizer" title="Resize Remote files"></div>
              <section class="new-files-panel" id="new-files-panel"></section>
            </div>
          </div>
        </aside>

        <div class="sidebar-resizer" id="sidebar-resizer" title="Resize sidebar"></div>

        <main class="workbench">
          <div class="editor-tabs" id="editor-tabs"></div>

          <div class="workspace__toolbar" id="browser-toolbar">
            <div class="browser-toolbar-controls">
              <button class="icon-button icon-button--toolbar" id="browser-back" type="button" title="Back" aria-label="Back">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M9.5 3.5L5 8l4.5 4.5M5.5 8H13" />
                </svg>
              </button>
              <button class="icon-button icon-button--toolbar" id="browser-forward" type="button" title="Forward" aria-label="Forward">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M6.5 3.5L11 8l-4.5 4.5M10.5 8H3" />
                </svg>
              </button>
              <button class="icon-button icon-button--toolbar" id="browser-refresh-stop" type="button" title="Refresh" aria-label="Refresh">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M12.5 6.5V3.5h-3M12 4a5 5 0 1 0 1 5" />
                </svg>
              </button>
            </div>
            <form class="address-bar" id="browser-address-form">
              <input
                class="address-bar__input"
                id="browser-url"
                type="text"
                spellcheck="false"
                autocomplete="off"
                aria-label="Page address"
              />
            </form>
          </div>

          <div class="editor-surface">
            <section class="editor-view editor-view--active" id="browser-view">
              <webview id="chatgpt-browser" allowpopups></webview>
            </section>
            <section class="editor-view" id="chat-history-view"></section>
            <section class="editor-view" id="prompt-editor-view"></section>
          </div>

          <div class="bottom-panel-resizer" id="bottom-panel-resizer"></div>

          <section class="bottom-panel" id="bottom-panel">
            <div class="bottom-panel__header">
              <div class="bottom-panel__header-main">
                <div class="bottom-panel__tabs" id="bottom-tabs"></div>
                <button class="icon-button icon-button--tabbar" id="open-terminal" type="button" title="Open terminal" aria-label="Open terminal">
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M2 3.5h12v9H2zM4 6l2 2-2 2M7.5 10H11" />
                  </svg>
                </button>
                <button
                  class="icon-button icon-button--tabbar"
                  id="toggle-debug-panel-bottom"
                  type="button"
                  title="Collapse bottom panel"
                  aria-label="Collapse bottom panel"
                >
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M3 4.5h10M5.5 8.5L8 11l2.5-2.5" />
                  </svg>
                </button>
              </div>
            </div>
            <div class="bottom-panel__body">
              <section class="bottom-panel-view bottom-panel-view--active" id="debug-view">
                <div class="debug-console-shell">
                  <div class="debug-console-toolbar">
                    <input
                      class="debug-console-toolbar__input"
                      id="debug-filter"
                      type="search"
                      placeholder="Filter logs"
                      aria-label="Filter debug output"
                    />
                    <div class="debug-console-toolbar__actions">
                      <div class="retention-switch" id="debug-retention">
                        <button class="retention-switch__button retention-switch__button--active" data-retention="100" type="button">
                          100
                        </button>
                        <button class="retention-switch__button" data-retention="1000" type="button">1000</button>
                      </div>
                      <button class="icon-button" id="copy-debug" type="button" title="Copy visible logs" aria-label="Copy visible logs">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                          <path d="M5 5.5h7v8H5zM3.5 10.5H3V3h7.5v.5" />
                        </svg>
                      </button>
                      <button class="icon-button" id="clear-debug" type="button" title="Clear logs" aria-label="Clear logs">
                        <svg viewBox="0 0 16 16" aria-hidden="true">
                          <path d="M3 4.5h10M6 4.5V3h4v1.5M5.5 6.5v5M8 6.5v5M10.5 6.5v5M4.5 4.5l.5 8h6l.5-8" />
                        </svg>
                      </button>
                    </div>
                  </div>
                  <div class="debug-console" id="debug-console"></div>
                </div>
              </section>

              <section class="bottom-panel-view" id="terminal-view">
                <div class="terminal-pane" id="terminal-pane">
                  <div class="terminal-pane__empty" id="terminal-empty">
                    Click the terminal button in the tab bar to start an embedded shell in the current project folder.
                  </div>
                  <div class="terminal-pane__meta" id="terminal-meta"></div>
                  <div class="terminal-pane__host" id="terminal-host"></div>
                </div>
              </section>

              <section class="bottom-panel-view" id="git-view"></section>
            </div>
          </section>
        </main>
      </div>

      <div class="drag-shield" id="drag-shield" hidden></div>
    </div>

    <script src="./vendor/xterm.js"></script>
    <script src="./vendor/addon-fit.js"></script>
    <script src="./vendor/markdown-it.min.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
